spring.application.name=BACKEND
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.engine.transaction.jta.platform.i.JtaPlatformInitiator=WARN
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example.BACKEND_OLDTECH_WEBSITE=DEBUG

# ===============================
# OAuth2 Login Configuration
# ===============================

## Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

## Facebook Login
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/oauth2/callback/{registrationId}

# Frontend URL
frontend.url=http://localhost:3000

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ===============================
# Payment Configuration
# ===============================

# ===============================
# Server Configuration
# ===============================
server.port=8080
server.servlet.context-path=/oldtech

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# MOMO Payment Configuration
#momo.partnerCode=${MOMO_PARTNER_CODE}
#momo.accessKey=${MOMO_ACCESS_KEY}
#momo.secretKey=${MOMO_SECRET_KEY}
#momo.endpoint=${MOMO_ENDPOINT}
#momo.returnUrl=${MOMO_RETURN_URL}
#momo.ipnUrl=${MOMO_IPN_URL}

momo.partnerCode=${TEST_MOMO_PARTNER_CODE}
momo.accessKey=${TEST_MOMO_ACCESS_KEY}
momo.secretKey=${TEST_MOMO_SECRET_KEY}
momo.endpoint=${TEST_MOMO_ENDPOINT}
momo.returnUrl=${TEST_MOMO_RETURN_URL}
momo.ipnUrl=${TEST_MOMO_IPN_URL}

# Add these properties to disable foreign key validation temporarily
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.javax.persistence.schema-generation.create-source=metadata
spring.jpa.properties.javax.persistence.schema-generation.scripts.action=none
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# Execute SQL scripts on startup
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
