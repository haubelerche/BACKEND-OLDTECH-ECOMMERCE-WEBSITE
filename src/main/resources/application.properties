spring.datasource.url=jdbc:mysql://localhost:3306/secondhand_sale
spring.datasource.username=root
spring.datasource.password=29092004H@u
app.environment=local




spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Reduce logging levels for production environment
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.hibernate.engine.transaction.jta.platform.i.JtaPlatformInitiator=WARN
logging.level.org.springframework.security=INFO

logging.level.com.example.BACKEND_OLDTECH_WEBSITE=INFO

# ===============================
# OAuth2 Login Configuration
# ===============================

## Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://funny-leading-puma.ngrok-free.app/oldtech/login/oauth2/code/google

## Facebook Login
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=https://funny-leading-puma.ngrok-free.app/oldtech/login/oauth2/code/facebook

# Facebook provider additional configuration
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v18.0/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code

# Enhanced OAuth2 debugging
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG
# Add more detailed HTTP logging to see request/response bodies
logging.level.org.springframework.http.converter.json=DEBUG

# ===============================
# Jackson Configuration
# ===============================
# Enable case-insensitive enum deserialization
spring.jackson.mapper.accept-case-insensitive-enums=true

# Frontend URL - Make sure this matches your actual frontend URL
# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
frontend.url=http://localhost:3000
# ===============================
# Payment Configuration
# ===============================
# ===============================
# Server Configuration for ngrok forwarding
# ===============================
server.port=8080
server.servlet.context-path=/oldtech




server.tomcat.redirect-context-root=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# Use environment-specific configuration with proper IPN URL
momo.partnerCode=${MOMO_PARTNER_CODE}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_SECRET_KEY}
momo.endpoint=${MOMO_ENDPOINT}
momo.returnUrl=${MOMO_RETURN_URL}
# Don't use localhost in production for IPN URL
momo.ipnUrl=${MOMO_IPN_URL}

spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Database initialization - set to never in production
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.sql.init.continue-on-error=true

# Base URL for the application - updated to match context path
app.base-url=https://funny-leading-puma.ngrok-free.app/oldtech

spring.jpa.show-sql=false

# ===============================
# Essential ngrok proxying configuration
# ===============================

# Critical for proper handling of forwarded requests
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=.*

# Cookie configuration for proxied environment
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Enable debugging for request forwarding issues
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.tomcat.util.http=DEBUG

# Explicitly disable Spring's automatic redirect since ngrok handles it
server.tomcat.use-relative-redirects=false



