# Simplified Test Configuration - Focus on Main Application Only
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Enable ETL for testing
etl.enabled=true
etl.scheduling.enabled=false
spring.kafka.enabled=false

# Security for tests
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Server configuration
server.error.include-message=always

# Logging
logging.level.root=WARN
logging.level.com.example.BACKEND_OLDTECH_WEBSITE=INFO
logging.level.com.example.BACKEND_OLDTECH_WEBSITE.ETL=DEBUG

# Disable background tasks
spring.task.scheduling.enabled=false
