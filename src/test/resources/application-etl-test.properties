# ETL Test Configuration
# Cấu hình cho môi trường test ETL

# Database configuration for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# ETL specific configurations
etl.enabled=true
etl.scheduler.enabled=false

# Kafka configuration for testing (embedded or mock)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Logging for tests
logging.level.com.example.BACKEND_OLDTECH_WEBSITE.ETL=DEBUG
logging.level.org.springframework.kafka=WARN

# Security configuration for tests
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=ADMIN

# Disable other features during ETL testing
spring.mail.host=localhost
spring.mail.port=1025
